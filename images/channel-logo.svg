<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 -10 959.19 390"
  class="logo-svg"
  overflow="visible"
  preserveAspectRatio="xMidYMid meet"
>
  <defs>
    <style>
      .white { fill: #ffffff; }
      .blue  { fill: #4cabe0; }
      .green { fill: #3aa449; }

      :root {
        --ease-reveal: cubic-bezier(0.18, 0.9, 0.22, 1);
        --ease-premium: cubic-bezier(0.2, 0.72, 0.16, 1);
        --ease-soft: cubic-bezier(0.33, 0, 0.2, 1);
        --ease-float: cubic-bezier(0.42, 0, 0.38, 1);
        --intro-center-shift: 342px;
        --text-hidden-shift: -88px;
        --split-start: 1.92s;
      }

      .logo-svg {
        display: block;
        width: min(92vw, 960px);
        height: auto;
        margin: 0 auto;
        overflow: visible;
      }

      #stage {
        isolation: isolate;
      }

      #bg,
      #text-group,
      #logo-group,
      #ak-group,
      #leaf-group,
      .bubble,
      .wave {
        transform-box: fill-box;
        transform-origin: center;
        will-change: transform, opacity;
      }

      #bg {
        opacity: 1;
      }

      #logo-group {
        transform: translate3d(var(--intro-center-shift), 0, 0);
        animation: logo-split 0.92s var(--split-start) var(--ease-premium) forwards;
      }

      #ak-group {
        opacity: 0;
        transform: scale(0.95);
        animation: ak-reveal 0.9s 0.08s var(--ease-reveal) forwards;
      }

      #leaf-group {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: 6% 100%;
        transform: scale(0);
        animation: leaf-grow 0.72s 0.5s var(--ease-premium) forwards;
      }

      #text-group {
        opacity: 0;
        transform: translate3d(var(--text-hidden-shift), 0, 0);
        animation:
          text-emerge 0.92s var(--split-start) var(--ease-premium) forwards,
          text-fade 0.22s calc(var(--split-start) + 0.02s) linear forwards;
      }

      .wave {
        opacity: 0;
        transform: translate3d(0, 28px, 0);
      }

      #wave-big {
        animation: wave-rise 0.84s calc(var(--split-start) + 0.1s) var(--ease-soft) forwards;
      }

      #wave-small {
        animation: wave-rise 0.78s calc(var(--split-start) + 0.24s) var(--ease-soft) forwards;
      }

      .bubble {
        opacity: 0;
      }

      #bubble-small {
        transform-origin: center;
        transform: scale(0.2);
        animation: bubble-pop-small 0.38s calc(var(--split-start) + 0.98s) var(--ease-reveal) forwards;
      }

      #bubble-big {
        transform-origin: center;
        transform: scale(0.3);
        animation: bubble-pop-big 0.44s calc(var(--split-start) + 1.14s) var(--ease-reveal) forwards;
      }

      #bubble-small circle,
      #bubble-big circle {
        transform-box: fill-box;
        transform-origin: center;
      }

      #bubble-small circle {
        animation: bubble-float-small 4.8s calc(var(--split-start) + 1.42s) var(--ease-float) infinite alternate;
      }

      #bubble-big circle {
        animation: bubble-float-big 6.2s calc(var(--split-start) + 1.6s) var(--ease-float) infinite alternate;
      }

      @keyframes ak-reveal {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes leaf-grow {
        0% {
          opacity: 0;
          transform: scale(0);
        }
        62% {
          opacity: 1;
          transform: scale(1.08);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes logo-split {
        0% {
          transform: translate3d(var(--intro-center-shift), 0, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes text-emerge {
        0% {
          transform: translate3d(var(--text-hidden-shift), 0, 0);
        }
        100% {
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes text-fade {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      @keyframes wave-rise {
        0% {
          opacity: 0;
          transform: translate3d(0, 28px, 0);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes bubble-pop-small {
        0% {
          opacity: 0;
          transform: scale(0.2);
        }
        72% {
          opacity: 1;
          transform: scale(1.08);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes bubble-pop-big {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        70% {
          opacity: 1;
          transform: scale(1.06);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes bubble-float-small {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(-4px, -8px, 0) scale(1.02);
        }
      }

      @keyframes bubble-float-big {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        100% {
          transform: translate3d(3px, -10px, 0) scale(1.015);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #logo-group,
        #ak-group,
        #leaf-group,
        #text-group,
        #wave-big,
        #wave-small,
        #bubble-small,
        #bubble-big {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

